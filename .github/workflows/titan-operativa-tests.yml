name: TITAN · bots de autoinversión operativa (sin trading)

on:
  pull_request:
    paths:
      - 'titan-operativa/**'
      - '.github/workflows/titan-operativa-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: No secrets · no payments · only stdlib deterministic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s titan-operativa -p 'test_*.py' -v
      - name: Check code compiles
        run: |
          python -m compileall -q titan-operativa
